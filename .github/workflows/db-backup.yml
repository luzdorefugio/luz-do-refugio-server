name: Backup Base de Dados (Semanal)

on:
  schedule:
    # "Ao minuto 0, da hora 23, todos os dias do mês, todos os meses, no Sábado (6)"
    - cron: '0 23 * * 6'

  # Isto permite-te ir ao GitHub e clicar num botão para forçar o backup agora (bom para testar)
  workflow_dispatch:

jobs:
  backup_database:
    runs-on: ubuntu-latest
    name: Fazer Dump do PostgreSQL

    steps:
      - name: Instalar Cliente Postgres
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Criar e Comprimir Backup
        env:
          # Esta variável vai buscar o valor que definires nos Settings do GitHub
          PG_CONNECTION_STRING: ${{ secrets.RAILWAY_DB_URL }}
        run: |
          echo "A iniciar backup da Railway..."
          # Usamos a flag --dbname para passar a string completa (host, user, pass, db)
          pg_dump --dbname="$PG_CONNECTION_STRING" | gzip > backup_luz_refugio_$(date +%Y-%m-%d).sql.gz
          echo "Backup concluído."

      - name: Guardar Backup no GitHub (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: backup-semanal-${{ github.run_id }}
          path: backup_luz_refugio_*.sql.gz
          retention-days: 30 # O ficheiro apaga-se sozinho passados 30 dias