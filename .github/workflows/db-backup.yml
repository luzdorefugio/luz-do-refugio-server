name: Backup Base de Dados (Semanal)

on:
  schedule:
    - cron: '0 23 * * 6'
  workflow_dispatch: # Permite testar manualmente na branch 'backup-test'

jobs:
  backup_database:
    runs-on: ubuntu-latest
    name: Fazer Dump do PostgreSQL

    steps:
      - name: Instalar Cliente Postgres
        run: |
          # Instalamos a versão 16 para garantir compatibilidade com as DBs modernas
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16

      - name: Criar e Comprimir Backup
        env:
          # Garante que o Secret está bem definido no GitHub
          PG_URL: ${{ secrets.RAILWAY_DB_URL }}
        run: |
          echo "🚀 A iniciar backup remoto da Railway..."
          
          # 1. Usamos aspas duplas para proteger a string
          # 2. Adicionamos flags explícitas para evitar o erro de socket
          # 3. O pg_dump com a flag --dbname ignora o socket se a URL tiver o host
          
          pg_dump --dbname="$PG_URL" \
                  --no-owner \
                  --no-privileges \
                  --clean \
                  --if-exists | gzip > backup_luz_refugio_$(date +%Y-%m-%d).sql.gz
          
          echo "✅ Backup concluído e comprimido."

      - name: Guardar Backup no GitHub (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: backup-luz-refugio-${{ github.run_id }}
          path: backup_luz_refugio_*.sql.gz
          retention-days: 30