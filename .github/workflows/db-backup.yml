name: Backup Base de Dados (Semanal)

on:
  schedule:
    - cron: '0 23 * * 6'
  workflow_dispatch:

jobs:
  backup_database:
    runs-on: ubuntu-latest
    name: Fazer Dump do PostgreSQL

    steps:
      - name: Instalar Cliente Postgres
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16

      - name: Criar e Comprimir Backup
        env:
          PG_URL: ${{ secrets.RAILWAY_DB_URL }}
        run: |
          echo "🚀 A iniciar backup..."
          
          # Se o PG_URL não estiver definido, o script pára aqui
          if [ -z "$PG_URL" ]; then
            echo "❌ ERRO: Secret RAILWAY_DB_URL não configurado!"
            exit 1
          fi

          # O comando pg_dump numa única linha para evitar erros de escape
          pg_dump "$PG_URL" --no-owner --no-privileges --clean | gzip > backup_luz_refugio_$(date +%Y-%m-%d).sql.gz
          
          echo "✅ Backup concluído."

      - name: Guardar Backup no GitHub (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: backup-luz-refugio-${{ github.run_id }}
          path: backup_luz_refugio_*.sql.gz
          retention-days: 30