name: Backup Base de Dados (Semanal)

on:
  schedule:
    # Corre todos os Sábados às 23:00 UTC
    - cron: '0 23 * * 6'

  # Permite que testes manualmente na tua branch 'backup-test'
  workflow_dispatch:

jobs:
  backup_database:
    runs-on: ubuntu-latest
    name: Fazer Dump do PostgreSQL

    steps:
      - name: Instalar Cliente Postgres
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16

      - name: Criar e Comprimir Backup
        env:
          PG_URL: ${{ secrets.RAILWAY_DB_URL }}
        run: |
          echo "🚀 A decompor a ligação da Railway..."
          
          # Verificação de segurança da Secret
          if [ -z "$PG_URL" ]; then
            echo "❌ ERRO: A Secret RAILWAY_DB_URL não foi encontrada!"
            exit 1
          fi

          # Usamos Python para extrair os dados da URL de forma segura
          export PGHOST=$(python3 -c "from urllib.parse import urlparse; print(urlparse('$PG_URL').hostname)")
          export PGPORT=$(python3 -c "from urllib.parse import urlparse; print(urlparse('$PG_URL').port or 5432)")
          export PGUSER=$(python3 -c "from urllib.parse import urlparse; print(urlparse('$PG_URL').username)")
          export PGPASSWORD=$(python3 -c "from urllib.parse import urlparse; print(urlparse('$PG_URL').password)")
          export PGDATABASE=$(python3 -c "from urllib.parse import urlparse; print(urlparse('$PG_URL').path.lstrip('/'))")

          echo "📡 A ligar ao host remoto: $PGHOST na porta $PGPORT..."

          # Execução do backup forçando TCP/IP através das flags -h e -p
          # Isto mata o erro de socket de uma vez por todas
          pg_dump -h "$PGHOST" \
                  -p "$PGPORT" \
                  -U "$PGUSER" \
                  -d "$PGDATABASE" \
                  --no-owner \
                  --no-privileges \
                  --clean \
                  --if-exists | gzip > backup_luz_refugio_$(date +%Y-%m-%d).sql.gz

          echo "✅ Backup concluído com sucesso."

      - name: Guardar Backup no GitHub (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: backup-semanal-${{ github.run_id }}
          path: backup_luz_refugio_*.sql.gz
          retention-days: 30